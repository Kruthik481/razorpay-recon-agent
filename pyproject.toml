[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-agent"
version = "1.0.0"
description = "Reconciliation exception-resolution agent: deterministic rules first, a model only on the ambiguous tail, and a review loop that turns confirmed exceptions into new rules."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kruthik481", email = "kruthikrocky@gmail.com" }]
keywords = ["reconciliation", "fintech", "agents", "payments", "settlement"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
recon = "recon.cli:main"

[project.urls]
Homepage = "https://github.com/Kruthik481/razorpay-recon-agent"
Issues = "https://github.com/Kruthik481/razorpay-recon-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "src" for the package, "." so `tests.conftest` resolves however pytest was
# started. `python -m pytest` puts the working directory on sys.path and bare
# `pytest` does not, and depending on that difference hid a broken CI for days.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["recon"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PIE", "RUF"]
ignore = [
  # Tool functions take a context they deliberately ignore, to keep one
  # uniform call signature across the whole registry.
  "ARG001",
  # Ternaries hurt readability in the gate, where each branch is a rule.
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["recon", "tests"]
