name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test with coverage
        run: PYTHONPATH=src pytest --cov=recon --cov-report=term-missing

      - name: The pipeline runs on a clean checkout with no API key
        run: PYTHONPATH=src python -m recon.cli run --cases 200 --seed 3

      - name: Incorrect postings must be zero
        run: PYTHONPATH=src python scripts/assert_no_bad_postings.py

      - name: File and function size limits
        run: PYTHONPATH=src python scripts/check_size_limits.py
